[project]
name = "kubernetes-resource-optimizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Filippo_Gandini", email = "filippo3.gandini@mail.polimi.it" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "scipy>=1.18.1",
]

[project.scripts]
kubernetes-resource-optimizer = "kubernetes_resource_optimizer:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
